es:
  title: Del VLM al *robot*
  q: ¿Cuántas tazas hay?
  instr: toma la taza naranja
  words: Hay|dos|tazas
  grip: pinza
  same: el mismo modelo, otra salida
  hz: una acción, muchas veces por segundo
  m1: RT-2 · 2023
  d1: escribe las acciones como si fueran texto
  m2: OpenVLA · 7 B
  d2: por dentro, un VLM (Llama 2 + DINOv2 + SigLIP)
  m3: SmolVLA · 450 M
  d3: sobre SmolVLM2, corre en una laptop
  punch: Un VLA es un VLM que aprendió a *mover* en vez de *hablar.*
  cite: 'RT-2 (arXiv:2307.15818) · OpenVLA (arXiv:2406.09246) · SmolVLA (hf.co/blog/smolvla) · números de acción ilustrativos'
en:
  title: From VLM to *robot*
  q: How many mugs?
  instr: pick up the orange mug
  words: Two|mugs
  grip: grip
  same: the same model, a different output
  hz: one action, many times per second
  m1: RT-2 · 2023
  d1: writes actions as if they were text
  m2: OpenVLA · 7 B
  d2: inside, a VLM (Llama 2 + DINOv2 + SigLIP)
  m3: SmolVLA · 450 M
  d3: built on SmolVLM2, runs on a laptop
  punch: A VLA is a VLM that learned to *move* instead of *talk.*
  cite: 'RT-2 (arXiv:2307.15818) · OpenVLA (arXiv:2406.09246) · SmolVLA (hf.co/blog/smolvla) · action numbers are illustrative'
