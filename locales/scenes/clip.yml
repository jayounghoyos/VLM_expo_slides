en:
  title: 'CLIP: learning to see by *reading*'
  caps: a cat|a bike|mountains|two mugs
  pull: The right pairs are pulled together.
  push: Everything else is pushed apart.
  pairs: image and text pairs, from the internet
  batch: 'batch: 32,768 pairs at a time'
  new: a new photo
  prompt: a photo of
  punch: 'No labels needed: 76.2% on ImageNet *without seeing any of its 1.28 M labels.*'
